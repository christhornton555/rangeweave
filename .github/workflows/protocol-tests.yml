name: Protocol tests

on:
  push:
    paths:
      - "host/python/**"
      - "protocol/**"
      - "firmware/pico2w/acquisition/**"
      - "tests/**"
      - ".github/workflows/protocol-tests.yml"
  pull_request:
    paths:
      - "host/python/**"
      - "protocol/**"
      - "firmware/pico2w/acquisition/**"
      - "tests/**"
      - ".github/workflows/protocol-tests.yml"

permissions:
  contents: read

jobs:
  python-protocol-conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run protocol and acquisition conformance tests
        run: python -m unittest discover -s tests -v
